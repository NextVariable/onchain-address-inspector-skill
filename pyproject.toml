[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["skills/onchain-address-inspector/scripts"]
concurrency = ["thread"]
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
show_missing = true
fail_under = 85
